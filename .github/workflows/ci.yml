name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # sounddevice imports are guarded by try/except, but install the runtime
      # so audio-backed modules import cleanly if they are exercised.
      - name: Install system audio libraries
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python_voice_service/requirements.txt
          pip install -r scripts/dialog_service/requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest tests -q
