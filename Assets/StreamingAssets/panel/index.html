<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rachel Console</title>
  <script src="/panel-assets/theme.js?v=2"></script>
  <link rel="stylesheet" href="/panel-assets/app.css?v=2">
  <script defer src="/panel-assets/lucide.min.js"></script>
  <script defer src="/panel-assets/shell.js?v=2"></script>
  <script defer src="/panel-assets/dashboard.js?v=2"></script>
</head>
<body data-page="dashboard">
  <section data-page-content>
    <header class="page-header">
      <div><h1>Applications</h1><p class="page-description">Games configured for this Rachel station.</p></div>
      <div class="header-actions"><button class="secondary" id="exit-game" type="button"><i data-lucide="square"></i>Exit Game</button><a class="button" href="/games.html"><i data-lucide="library"></i>Game Library</a></div>
    </header>

    <div class="application-grid" id="application-grid" aria-live="polite">
      <div class="empty-state">Loading configured games...</div>
    </div>

    <div class="section-heading"><h1>Quick Actions</h1><p>Open focused operator controls.</p></div>
    <div class="quick-grid">
      <a class="quick-action" href="/controls.html#expressions"><span class="quick-visual"><i data-lucide="smile-plus"></i></span><strong>Expressions</strong><span class="muted">Send Rachel face presets</span><span class="button">Open <i data-lucide="external-link"></i></span></a>
      <a class="quick-action" href="/controls.html#controller"><span class="quick-visual"><i data-lucide="gamepad-2"></i></span><strong>Controller</strong><span class="muted">Voice, camera, light and flower</span><span class="button">Open <i data-lucide="external-link"></i></span></a>
    </div>
  </section>
</body>
</html>
