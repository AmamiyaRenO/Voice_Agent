<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Telemetry | Rachel Console</title>
  <script src="/panel-assets/theme.js?v=2"></script>
  <link rel="stylesheet" href="/panel-assets/app.css?v=2">
  <script defer src="/panel-assets/lucide.min.js"></script><script defer src="/panel-assets/shell.js?v=2"></script><script defer src="/panel-assets/telemetry.js"></script>
</head>
<body data-page="telemetry">
  <section data-page-content>
    <header class="page-header">
      <div class="workspace-title"><a class="icon-button" href="/runtime.html" aria-label="Back to Settings" title="Back"><i data-lucide="arrow-left"></i></a><div><div class="page-kicker">Developer</div><h1>Telemetry</h1><p class="page-description">Inspect participant trends in the existing telemetry dashboard.</p></div></div>
      <div class="header-actions"><button class="secondary" id="open-telemetry" type="button"><i data-lucide="external-link"></i>Open separately</button><button id="refresh-telemetry" type="button"><i data-lucide="refresh-cw"></i>Refresh dashboard</button></div>
    </header>
    <section class="panel">
      <div class="toolbar" style="margin-bottom:14px">
        <div class="inline-field"><label for="telemetry-user">Participant</label><input id="telemetry-user" value="demo_user"></div>
        <div class="inline-field"><label for="telemetry-days">Range</label><select id="telemetry-days"><option value="7">7 days</option><option value="14" selected>14 days</option><option value="21">21 days</option><option value="30">30 days</option></select></div>
      </div>
      <iframe class="telemetry-frame" id="telemetry-frame" title="Rachel telemetry dashboard"></iframe>
    </section>
  </section>
</body>
</html>
